# PSRule for Azure configuration — static security scan run by
# .github/workflows/bicep-lint.yml. Rule names reflect the PSRule.Rules.Azure
# catalog at time of writing; confirm with your installed version before
# relying on them: ps-rule list --module PSRule.Rules.Azure
#
# Each suppression below is a deliberate TP choice (see the TP answer key,
# CORRECTION-BICEP-AZURE.md section 5). This file hasn't been run
# against a real PSRule scan yet — adjust rule names if the first CI run
# flags different ones.

input:
  pathIgnore:
    - "**/*.md"
    - ".github/**"
    - "**/*.json" # parameter files and compiled JSON, not relevant to the scan

configuration:
  AZURE_BICEP_FILE_EXPANSION: true
  AZURE_BICEP_FILE_EXPANSION_TIMEOUT: 30
  AZURE_PARAMETER_FILE_EXPANSION: true

rule:
  includeLocal: true
  baseline: Azure.Default

suppression:
  # Allow-HTTP rule with source '*': port 80 is intentionally open for curl
  # verification (exercises 1, 2 and bonus).
  Azure.NSG.AnyInboundSource:
    - "simplon-tp104-nsg-vm"
    - "simplon-tp104-nsg-vmss"
    - "simplon-tp104-bonus-nsg"

  # ACI intentionally exposed publicly — demo container for this TP.
  Azure.Container.PublicIP:
    - "simplon-tp104-aci"

  # App Service Authentication (Entra ID / B2C) out of scope for this TP.
  Azure.AppService.AuthEnabled:
    - "simplon-tp104-web-*"

  # S1 plan — zone redundancy needs Premium v2/v3, out of budget (S1 is
  # already the priciest SKU here, required only for deployment slots).
  Azure.AppService.AvailabilityZone:
    - "simplon-tp104-plan"

  # Single VM/VMSS/public IP without zone redundancy — out of scope (the
  # AZ-104 "availability" module is covered by the VMSS + autoscale of
  # exercise 2, not multi-zone HA). Add the exact Azure.VM.* / Azure.PublicIP.*
  # rule names PSRule reports on the first run here, with the same rationale.
