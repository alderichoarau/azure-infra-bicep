name: Bicep CI
run-name: "CI · build · lint · PSRule · ${{ github.ref_name }} by @${{ github.actor }}"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read # default minimal — jobs override as needed

jobs:
  # ── Validate ────────────────────────────────────────────────────────────────
  # No Azure login required: `bicep build` only compiles/type-checks locally and
  # runs the linter configured in bicep/bicepconfig.json (rules set to "error"
  # fail the build). This mirrors the Terraform `validate` job, which also runs
  # without Azure credentials.
  validate:
    name: Validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bicep
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install/upgrade Bicep CLI
        run: |
          az bicep install
          az bicep upgrade

      - name: Bicep Build (compile + lint via bicepconfig.json)
        run: az bicep build --file main.bicep --stdout > /dev/null

      - name: Bicep Format Check
        continue-on-error: true # informative only — not a hard CI gate
        run: |
          az bicep format --file main.bicep --outfile /tmp/main.fmt.bicep
          diff -u main.bicep /tmp/main.fmt.bicep

      - name: Bicep Param File Build (sanity check)
        run: az bicep build-params --file main.bicepparam --stdout > /dev/null

  # ── Security ─────────────────────────────────────────────────────────────────
  security:
    name: Security — PSRule for Azure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: PSRule for Azure
        uses: microsoft/ps-rule@v2
        with:
          modules: 'PSRule.Rules.Azure'
          inputPath: 'bicep/'
          outputFormat: NUnit3
          outputPath: reports/ps-rule-results.xml

      - name: Upload PSRule results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: psrule-results
          path: reports/ps-rule-results.xml
